[project]
name = "ferment"
version = "0.1.0"
description = "Tools for running a software stack on an ephemeral VM under a faked clock: VM providers, ssh tunnels, time control, process-compose stacks."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pymysql>=1.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "structlog>=25.0",
    "tomli-w>=1.0",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ferment"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B904", # raise typer.Exit() inside except is intentional flow control
]
